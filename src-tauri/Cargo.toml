[package]
name = "dpa"
version = "0.1.0"
description = "Delta PLC AI Generator — AI-assisted ST/LD/IL code generation for Delta DVP Series PLCs"
authors = ["Delta PLC AI Generator Contributors"]
edition = "2021"
rust-version = "1.77"
license = "MIT"
repository = "https://github.com/delta/dpa"

[lib]
name = "dpa_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"

chrono = { version = "0.4", features = ["serde"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "linux-native", "sync-secret-service"] }
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tokio = { version = "1", features = ["fs", "macros", "rt-multi-thread", "sync"] }
uuid = { version = "1", features = ["serde", "v4"] }

[profile.release]
strip = true
lto = "thin"
